// ktpls project model: prints, for each project's source sets, the source
// folders, the compile classpath and the Kotlin compiler plugin options.
// Lines are tab-separated: KIND, project path, source set, value.
allprojects {
    tasks.register('ktplsModel') {
        doLast {
            def ss = project.extensions.findByName('sourceSets')
            if (ss == null) return
            ss.each { s ->
                def dirs = new LinkedHashSet(s.java.srcDirs)
                def k = s.extensions.findByName('kotlin')
                if (k != null) dirs.addAll(k.srcDirs)
                println "KTPLS-SOURCES\t${project.path}\t${s.name}\t" + dirs.findAll { it.exists() }.join(File.pathSeparator)
                println "KTPLS-CLASSPATH\t${project.path}\t${s.name}\t" + s.compileClasspath.files.join(File.pathSeparator)
                def taskName = s.getCompileTaskName('kotlin')
                def t = project.tasks.findByName(taskName)
                if (t != null && t.hasProperty('pluginOptions')) {
                    t.pluginOptions.get().each { cfg ->
                        cfg.allOptions().each { id, opts ->
                            opts.each { o -> println "KTPLS-PLUGIN\t${project.path}\t${s.name}\t${id}:${o.key}=${o.value}" }
                        }
                    }
                }
            }
        }
    }
}

// ktplsSources downloads the sources jars of the compile classpaths into
// Gradle's cache, where the analyzer finds library documentation.
allprojects {
    tasks.register('ktplsSources') {
        doLast {
            def ss = project.extensions.findByName('sourceSets')
            if (ss == null) return
            def ids = new LinkedHashSet()
            ss.each { s ->
                def cfg = project.configurations.findByName(s.compileClasspathConfigurationName)
                if (cfg == null || !cfg.canBeResolved) return
                cfg.incoming.resolutionResult.allComponents.each { c ->
                    if (c.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) ids.add(c.id)
                }
            }
            def result = project.dependencies.createArtifactResolutionQuery()
                .forComponents(ids)
                .withArtifacts(org.gradle.jvm.JvmLibrary, org.gradle.language.base.artifact.SourcesArtifact)
                .execute()
            def n = 0
            result.resolvedComponents.each { c ->
                c.getArtifacts(org.gradle.language.base.artifact.SourcesArtifact).each { a ->
                    if (a instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) n++
                }
            }
            println "KTPLS-SOURCES-JARS\t${project.path}\t${n}\t${ids.size()}"
        }
    }
}
